<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>

    <!-- Core Bright Gold Gradient -->
    <linearGradient id="brightGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59341"/>
      <stop offset="30%" stop-color="#fff6cc"/>
      <stop offset="50%" stop-color="#f3c66f"/>
      <stop offset="85%" stop-color="#fff8d6"/>
      <stop offset="100%" stop-color="#ba8630"/>
    </linearGradient>

    <!-- Magic Blue Flourish Gradient -->
    <linearGradient id="magicBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#99ccff"/>
      <stop offset="70%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>

    <!-- Intense Glow Filter for Sparkles -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Premium Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <g transform="translate(10, 10)">
    <!-- Ambient Behind-Logo Gold Glow -->
    <circle cx="240" cy="240" r="100" fill="#f3c66f" opacity="0.15" filter="url(#glow)"/>

    <!-- Left Floral & Blue Flourish Swirls -->
    <path d="M 160 380 C 130 340, 110 260, 170 210 C 200 190, 230 220, 210 250 C 190 270, 160 250, 175 220" fill="none" stroke="url(#brightGold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 140 360 C 100 300, 120 220, 190 170" fill="none" stroke="url(#magicBlue)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 125 320 C 110 280, 130 240, 165 220" fill="none" stroke="url(#brightGold)" stroke-width="3"/>

    <!-- Right Dynamic Glowing Swoosh -->
    <path d="M 230 260 C 290 220, 360 170, 400 230 C 430 275, 380 340, 320 310 C 280 290, 295 240, 340 245" fill="none" stroke="url(#magicBlue)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 245 265 C 300 230, 355 190, 390 240 C 410 270, 375 315, 330 295" fill="none" stroke="url(#brightGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Main Majestic Letter 'A' Structure -->
    <!-- Left Leg & Serif Base -->
    <path d="M 140 390 L 195 390 M 170 390 L 235 210" stroke="url(#brightGold)" stroke-width="24" stroke-linecap="butt" stroke-linejoin="matrix" fill="none"/>
    <!-- Right Thick Dynamic Leg -->
    <path d="M 230 200 L 335 390 M 305 390 L 370 390" stroke="url(#brightGold)" stroke-width="34" stroke-linecap="butt" fill="none"/>
    <!-- Center Crossbar -->
    <path d="M 205 310 L 295 310" stroke="url(#brightGold)" stroke-width="14" fill="none"/>
    <!-- Sharp Apex/Top Joint -->
    <path d="M 222 220 L 244 140 L 260 210" fill="url(#brightGold)"/>

    <!-- Luxury Diamond Flowers (Left Side) -->
    <!-- Flower 1 Center -->
    <circle cx="185" cy="170" r="6" fill="#ffffff" filter="url(#glow)"/>
    <!-- Flower 1 Petals -->
    <path d="M 185 155 Q 185 170 170 170 Q 185 170 185 185 Q 185 170 200 170 Q 185 170 185 155 Z" fill="url(#magicBlue)"/>
    
    <!-- Flower 2 Center -->
    <circle cx="210" cy="150" r="5" fill="#ffffff" filter="url(#glow)"/>
    <!-- Flower 2 Petals -->
    <path d="M 210 138 Q 210 150 198 150 Q 210 150 210 162 Q 210 150 222 150 Q 210 150 210 138 Z" fill="url(#magicBlue)"/>

    <!-- Sparkles & Shimmer Effects (Stars) -->
    <!-- Main Top-Right Sparkle -->
    <path d="M 244 140 Q 244 140 244 100 Q 244 140 284 140 Q 244 140 244 180 Q 244 140 204 140 Q 244 140 244 100 Z" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="244" cy="140" r="5" fill="#ffffff"/>

    <!-- Small Accent Sparkles -->
    <g filter="url(#glow)" fill="#ffffff">
      <path d="M 360 200 Q 360 200 360 190 Q 360 200 370 200 Q 360 200 360 210 Q 360 200 350 200 Z"/>
      <path d="M 140 260 Q 140 260 140 252 Q 140 260 148 260 Q 140 260 140 268 Q 140 260 132 260 Z"/>
      <path d="M 310 330 Q 310 330 310 324 Q 310 330 316 330 Q 310 330 310 336 Q 310 330 304 330 Z"/>
    </g>

    <!-- Magic Dusting / Small Pixels -->
    <circle cx="260" cy="110" r="2" fill="#fff6cc" filter="url(#glow)"/>
    <circle cx="380" cy="170" r="3" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="160" cy="140" r="2.5" fill="#fff6cc"/>
    <circle cx="120" cy="300" r="2" fill="#99ccff"/>
    <circle cx="340" cy="280" r="3" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
